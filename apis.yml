name: Orbital Therapeutics
description: >-
  Orbital Therapeutics was a Cambridge, Massachusetts biotechnology company
  developing next-generation RNA medicines, combining circular and linear RNA,
  targeted delivery, and AI-guided design across immunomodulation, in vivo
  CAR-T cell therapy, next-generation vaccines, and protein therapeutics. Its
  lead program, OTX-201, targeted autoimmune disease through B-cell depletion.
  Founded out of Beam Therapeutics and backed by ARCH Venture Partners, a16z
  Bio + Health, and Newpath Partners, the company raised a $270M Series A in
  2023. In October 2025 Bristol Myers Squibb agreed to acquire Orbital
  Therapeutics for $1.5 billion; orbitaltx.com now redirects to bms.com. As a
  therapeutics developer, Orbital publishes no public developer platform, API,
  or machine-readable API surface, so this record is an identity-only profile
  in the API Evangelist network.
